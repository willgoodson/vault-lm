name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to achieve and what gets in the way today.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How do you imagine it working?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Alternatives you've considered, examples from other apps, sketches.
