<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="200" y1="100" x2="824" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="330" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e8ff"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ead9ff" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 rounded square centered in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <g filter="url(#shadow)">
    <!-- open notebook: two pages meeting at the spine form a V -->
    <path d="M512 772 L282 452 Q270 434 290 428 Q402 402 492 470 Q508 482 512 500 Z" fill="url(#pageL)"/>
    <path d="M512 772 L742 452 Q754 434 734 428 Q622 402 532 470 Q516 482 512 500 Z" fill="url(#pageR)"/>
    <!-- page lines -->
    <g stroke="#a855f7" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M338 486 Q404 474 458 512"/><path d="M372 548 Q420 540 462 570"/>
      <path d="M686 486 Q620 474 566 512"/><path d="M652 548 Q604 540 562 570"/>
    </g>
    <!-- sparkle rising from the spine -->
    <path d="M512 214 C524 300 548 326 628 340 C548 354 524 380 512 466 C500 380 476 354 396 340 C476 326 500 300 512 214 Z" fill="#ffffff"/>
    <path d="M664 230 C669 262 678 272 708 277 C678 282 669 292 664 324 C659 292 650 282 620 277 C650 272 659 262 664 230 Z" fill="#ffffff" fill-opacity="0.85"/>
  </g>
</svg>
