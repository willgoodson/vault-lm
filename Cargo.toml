[workspace]
resolver = "2"
members = ["crates/vaultlm-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# Keep build output small (disk is tight): minimal debug info, no incremental bloat for deps.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# Proc-macros and build scripts must not be stripped: on macOS that corrupts their dylibs
# ("mis-aligned LINKEDIT string pool"). The app binary itself is still stripped.
[profile.release.build-override]
strip = false
debug = false
